<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dhanda Patrika | धंधा पत्रिका</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Playfair+Display:wght@700;900&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{--paper:#E4D2A0;--ink:#1A140C;--red:#8E2A1E;--blue:#1F2D55;--card:#EBDDB5;--mut:#5a4a32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1C170F;--ink:#E8D8AC;--red:#E27A66;--blue:#A9B8F2;--card:#261F13;--mut:#b3a380}}
:root[data-theme="dark"]{--paper:#1C170F;--ink:#E8D8AC;--red:#E27A66;--blue:#A9B8F2;--card:#261F13;--mut:#b3a380}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:10px;background:var(--paper) radial-gradient(circle at 12% 18%,rgba(110,70,20,.18),transparent 22%),radial-gradient(circle at 85% 40%,rgba(110,70,20,.14),transparent 25%),radial-gradient(circle at 30% 90%,rgba(110,70,20,.18),transparent 28%);color:var(--ink);font:400 18px/1.6 "IM Fell English",Georgia,"Times New Roman",serif}
main{max-width:880px;margin:0 auto;border:5px double var(--ink);padding:14px 22px 40px}
.ears{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-style:italic;border-bottom:1px solid var(--ink);padding-bottom:4px}
.mast{text-align:center;padding:14px 0 8px;border-bottom:4px double var(--ink)}
.hi{font:400 clamp(28px,7vw,46px)/1.1 "Tiro Devanagari Hindi","Noto Serif Devanagari",serif;color:var(--red);margin:0;animation:ink 2s ease-out both}
.en{font:900 clamp(34px,9vw,74px)/1 "Playfair Display",Georgia,serif;letter-spacing:1px;margin:2px 0 4px;animation:ink 2s .35s ease-out both}
@keyframes ink{from{opacity:0;filter:blur(9px);transform:scale(1.04)}to{opacity:1;filter:blur(0)}}
.motto{font-style:italic;font-size:14px;color:var(--mut);margin-top:4px}
.dateline{text-align:center;font-variant:small-caps;letter-spacing:1px;border-bottom:1px solid var(--ink);padding:5px 0;font-size:15px}
h2{font:900 clamp(22px,5vw,30px)/1.1 "Playfair Display",Georgia,serif;text-transform:uppercase;letter-spacing:1px;text-align:center;margin:0}
h2 small{display:block;font:italic 400 16px "IM Fell English",Georgia,serif;text-transform:none;letter-spacing:0;color:var(--mut);margin-top:5px}
.big{font-size:clamp(28px,7vw,52px);line-height:1.05}
.deck{text-align:center;font-style:italic;margin:8px auto;max-width:620px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:3px double var(--ink);border-bottom:3px double var(--ink);margin:14px 0 6px}.nums div{text-align:center;padding:14px 6px;border-right:1px solid var(--ink)}.nums div:last-child{border-right:0}.nums b{display:block;font:900 clamp(28px,6.5vw,42px)/1 "Playfair Display",Georgia,serif;color:var(--red)}.nums span{display:block;font-style:italic;font-size:14px;color:var(--mut);margin-top:4px}
.fl{text-align:center;color:var(--red);font-size:22px;margin:22px 0 4px;letter-spacing:10px}
.cols{column-width:290px;column-gap:26px;column-rule:1px solid var(--ink);text-align:justify;hyphens:auto;margin-top:12px}
.cols p{margin:0 0 9px}
.cols p:first-child:first-letter{font:900 3.4em/.8 "Playfair Display",serif;float:left;padding:6px 7px 0 0;color:var(--red)}
.box{border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;background:var(--card);padding:10px 14px;margin:16px 4px}
.box b.t{display:block;font:900 14px "Playfair Display",serif;font-variant:small-caps;letter-spacing:1px;color:var(--red);margin-bottom:2px}
.stop{border:4px double var(--red);padding:10px 14px;margin:18px 4px;text-align:center;background:var(--card)}
.stop b{color:var(--red);font-size:20px;letter-spacing:3px;animation:bl 1.4s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
table{width:100%;border-collapse:collapse;font-size:15.5px;margin-top:10px}
td,th{border-bottom:1px dotted var(--ink);padding:6px 5px;text-align:left;vertical-align:top}
th{border-bottom:2px solid var(--ink);font:700 16px "Playfair Display",serif;font-variant:small-caps}
td.v{font:900 17px "Playfair Display",serif}
td small{color:var(--mut);font-style:italic}
button{font:700 16px "Playfair Display",Georgia,serif;color:var(--card);background:var(--red);border:2px solid var(--ink);padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px) rotate(-1deg);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.led{position:relative;border:2px solid var(--ink);height:28px;margin:12px 0 4px;background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(0,0,0,.13) 17px 18px)}
.led i{display:block;height:100%;background:var(--blue);transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.stamp{position:absolute;right:8px;top:-8px;border:3px solid var(--red);color:var(--red);font:900 18px "Playfair Display",serif;padding:0 8px;background:var(--card);opacity:0;transform:rotate(-8deg)}
.stamp.go{animation:th .9s ease-out}
@keyframes th{0%{transform:rotate(-8deg) scale(2.5);opacity:0}25%,80%{transform:rotate(-8deg) scale(1);opacity:1}100%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
.flip{perspective:700px;background:none;border:0;box-shadow:none;padding:0;text-align:left;color:var(--ink);font:400 16px/1.45 "IM Fell English",serif;min-height:150px}
.flip:active{transform:none;box-shadow:none}
.flip>span{display:block;position:relative;min-height:150px;transform-style:preserve-3d;transition:transform .6s}
.flip.on>span{transform:rotateY(180deg)}
.flip em{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;padding:10px;margin:4px;font-style:normal;background:var(--card);overflow:auto}
.flip em:first-child{display:grid;place-items:center;text-align:center;font:900 21px/1.15 "Playfair Display",serif;background:var(--red);color:var(--card)}
.flip em:last-child{transform:rotateY(180deg)}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{background:var(--card);color:var(--ink);text-align:left}
.opts button.ok{background:var(--blue);color:#fff}
.opts button.no{background:var(--red);color:#fff}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:12px}
.ad{border:3px double var(--ink);padding:10px;text-align:center;font-size:15px;background:var(--card)}
.ad b{display:block;font:900 19px/1.1 "Playfair Display",serif;text-transform:uppercase;margin-bottom:4px}
footer{margin-top:30px;border-top:4px double var(--ink);padding-top:8px;text-align:center;font-style:italic;font-size:13px;color:var(--mut)}
#theme{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 10px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button id="theme" aria-label="Toggle day or lamp-light">Day / Lamp</button>
<script>
/* Built-in backup edition. The live daily content comes from edition.json. */
var EDITION={"vol": "Vol. I. No. CCLXXXIV", "price": "Price: Two Pice", "press": "Printed at the Dhanda Press", "date": "Sunday, the 11th of October, 2026. Morning Edition", "hook": "Today's money news in numbers, plain words and a few jokes.", "nums": [["5.50%", "RBI repo rate"], ["$100", "Brent crude, per barrel"], ["4.82%", "Inflation, August (provisional)"], ["$52bn", "Dip in forex reserves, one month"], ["8 weeks", "Market losing streak, now over"]], "stop": "The RBI's special dollar window for state-run oil firms takes effect on 12 October and will stay in place until further notice.", "ratesTitle": "By Electric Telegraph: Prices Current", "rates": [["RBI repo rate", "5.50%", "Raised by 0.25 points on 7th Oct. Source: RBI circular, 7 Oct 2026"], ["Other RBI rates", "SDF 5.25%, MSF 5.75%, Bank rate 5.75%", "Stance: calibrated tightening"], ["Inflation (CPI)", "4.82% (provisional)", "August 2026. MoSPI, base 2024=100. CPI index 108.74"], ["Food inflation (CFPI)", "5.95% (provisional)", "August 2026. MoSPI, base 2024=100. CFPI index 110.71"], ["Brent crude", "$100 per barrel", "The Hindu BusinessLine (news report), 10 Oct, 07:33 PM"], ["Forex reserves", "Down $52 billion in a month", "Times of India, 11 Oct, 03:48 AM"], ["Gold (OroPocket)", "Buy ₹15,574.88 / Sell ₹15,023.85 per gram", "As of 10 Oct 2026, 20:40 IST. OroPocket rates in INR per gram, not MCX or spot prices"], ["Silver (OroPocket)", "Buy ₹232.02 / Sell ₹219.03 per gram", "As of 10 Oct 2026, 20:40 IST. OroPocket rates in INR per gram, not MCX or spot prices"]], "stories": [{"t": "I. The Rupee Gets Help While the Reserves Dip", "sub": "Two new measures, and a lighter savings pot", "paras": ["The RBI is acting on two fronts to steady the rupee. From <b>12 October</b>, a special window lets public-sector oil firms meet their daily dollar needs, and it stays in place <b>until further notice</b>. The RBI has also tightened the rules for forex derivatives, with stricter paperwork and lower transaction limits.", "The strain shows in the reserves. Foreign exchange reserves dipped by <b>$52 billion in a month</b>, and Brent crude trades at <b>$100 a barrel</b>."], "plain": "Forex reserves are the nation's emergency savings in foreign currency. When a central bank steps in to support its money, those savings can shrink. Think of using your savings in a rough month: it helps, but the pot gets lighter.", "cardsT": "The three developments (touch to turn over)", "cards": [["The Dollar Window", "From the 12th, public-sector oil firms get a special window for their daily dollar needs. It stays until further notice."], ["Rules for Forex Bets", "Forex derivatives are wagers on currency prices. Stricter documentation and lower limits aim to cut speculative dollar demand."], ["Reserves Dip", "India's foreign exchange reserves fell by $52 billion in a month, as the RBI stepped in to support the rupee."]], "care": "A weaker rupee and dearer oil push up the price of imports: gadgets, foreign tuition, the imported trinket you have been eyeing."}, {"t": "II. The Market's Long Losing Streak Ends", "sub": "Eight weeks of red, then a breather", "paras": ["Indian stock markets <b>snapped an 8-week losing streak</b>, and the Nifty and Sensex are holding above what analysts call their crucial support, a level where falls have paused before.", "What next? Markets will watch Indian inflation data, US economic releases, company earnings, crude prices and the rupee. IT results from HCL Technologies, Wipro and Tech Mahindra may shape sector mood. High US yields and persistent selling by foreign institutional investors (FII) could weigh on shares."], "plain": "A losing streak is like eight rainy weekends in a row. One dry Saturday is welcome news, but it does not promise summer.", "ledger": {"total": 8, "step": 1, "label": "Losing weeks left to endure", "btn": "Survive another losing week", "title": "Try It Thyself: Break the Streak", "pre": "", "suf": " of 8", "dp": 0, "stamp": "SNAPPED"}, "care": "Falling markets worry anyone holding shares or mutual funds. A streak ending is good news, but nobody can promise what comes next."}, {"t": "III. What Might Come Next", "sub": "Rates, prices and a promised rulebook", "paras": [], "tiles": [["SBI Capital Markets: 75 to 100 bps", "Expects the RBI to raise the repo rate by 75 to 100 basis points in this cycle, with a larger hike possible in December 2026 depending on inflation data."], ["Inflation to peak in Q3 FY27", "The same report sees consumer inflation peaking in Q3 FY27, then easing. It warns costly crude, geopolitical tensions and rising borrowing costs could weigh on consumption."], ["SEBI rulebook within a week", "SEBI chief Tuhin Kanta Pandey expects guidelines on the settlement-price mechanism for derivatives on expiry days within a week, after a review of the Closing Auction Session."]]}, {"t": "IV. The Rate Climb, in Numbers", "sub": "One hike done, more possibly to come", "paras": ["The RBI raised the repo rate by 0.25 points on <b>7 October</b>. A <b>basis point</b> is one hundredth of a percentage point, so that is 25 basis points. SBI Capital Markets expects <b>75 to 100 basis points</b> of increases during this tightening cycle."], "race": {"a": ["SBI Capital Markets, upper end", "100 basis points", 100], "b": ["Raised on 7 October", "25 basis points", 25], "btn": "Start the Climb"}, "plain": "A higher repo rate means dearer loans for banks, and in time for you. Your monthly instalment (the EMI) is where most people feel it."}], "ads": [["Eight-Week Losing Streak, Slightly Used", "Recently retired. One careful owner. Sensex and Nifty will vouch for it."], ["Barrel of Brent Crude, $100", "No haggling. Apply to any oil-importing company, with dollars."]], "words": [["Repo rate", "The interest at which the central bank lends to banks. Now 5.50% after a 0.25 point rise on 7 Oct 2026."], ["Forex reserves", "Foreign currency assets held by a central bank. They recently dipped by $52 billion in a month."], ["Retail inflation", "How fast prices rise for common shoppers. 4.8% for August 2026 (4.82% provisional, per MoSPI)."], ["Basis point", "One hundredth of a percentage point. 100 basis points equal one full point."]], "quiz": [["By how much did forex reserves dip in a month?", ["$52 billion", "$5.2 billion", "$520 billion"], 0], ["How long was the stock market losing streak that just ended?", ["3 weeks", "12 weeks", "8 weeks"], 2], ["What is the RBI repo rate now?", ["5.25%", "5.50%", "6.00%"], 1]], "poll": "Do you think the RBI will raise the repo rate again by December 2026?", "foot": "Figures from the 11th October 2026 edition of The Dhanda Patrika, with gold and silver from OroPocket and inflation from MoSPI as named. Printed for learning only, and not as counsel on investing."};
/* ===== END DAILY EDITION ===== */
function boot(E){var h='';
function box(t,x){return '<div class="box"><b class="t">'+t+'</b>'+x+'</div>'}
function flips(a){return '<div class="grid">'+a.map(function(c){return '<button class="flip" aria-label="Turn card"><span><em>'+c[0]+'</em><em>'+c[1]+'</em></span></button>'}).join('')+'</div>'}
h+='<header class="mast"><p class="hi">धंधा पत्रिका</p><h1 class="en">The Dhanda Patrika</h1><div class="motto">Market news, explained like a friend would</div></header><div class="dateline">'+E.date+'</div>';
h+='<p class="deck" style="margin-top:16px">'+E.hook+'</p><div class="nums">'+E.nums.map(function(n){return '<div><b>'+n[0]+'</b><span>'+n[1]+'</span></div>'}).join('')+'</div>';
h+='<h2 style="margin-top:20px">'+E.ratesTitle+'</h2><table><tr><th>Matter</th><th>Reading</th><th>Remarks</th></tr>'+E.rates.map(function(r){return '<tr><td>'+r[0]+'</td><td class="v">'+r[1]+'</td><td><small>'+r[2]+'</small></td></tr>'}).join('')+'</table>';
E.stories.forEach(function(s,i){
 h+='<div class="fl">❦ ❦ ❦</div><h2>'+s.t+'<small>'+s.sub+'</small></h2>';
 if(s.paras.length)h+='<div class="cols">'+s.paras.map(function(p){return '<p>'+p+'</p>'}).join('')+'</div>';
 if(s.plain)h+=box('In Plain Words',s.plain);
 if(s.cards)h+='<h3 style="margin:14px 0 0;font-style:italic">'+s.cardsT+'</h3>'+flips(s.cards);
 if(s.tiles)h+='<div class="grid">'+s.tiles.map(function(t){return box(t[0],t[1])}).join('')+'</div>';
 if(s.ledger)h+=box(s.ledger.title,'<button id="omo">'+s.ledger.btn+'</button><div class="led"><i id="cash" style="width:100%"></i><span class="stamp" id="st">'+(s.ledger.stamp||'SOLD')+'</span></div><span id="cashtxt" style="font-style:italic;color:var(--mut)">'+s.ledger.label+': '+(s.ledger.pre===undefined?'₹':s.ledger.pre)+s.ledger.total.toFixed(s.ledger.dp===undefined?2:s.ledger.dp)+(s.ledger.suf===undefined?' lakh crore':s.ledger.suf)+'</span>');
 if(s.race)h+='<button id="race">'+s.race.btn+'</button><p style="margin:12px 0 0">'+s.race.a[0]+', '+s.race.a[1]+'</p><div class="led"><i id="b1" style="width:0;background:var(--red)"></i></div><p style="margin:8px 0 0">'+s.race.b[0]+', '+s.race.b[1]+'</p><div class="led"><i id="b2" style="width:0"></i></div>';
 if(s.care)h+=box('What It Means for Thee',s.care);
});
h+='<div class="stop"><b>STOP PRESS</b><br>'+E.stop+'</div>';
h+='<div class="fl">❦ ❦ ❦</div><h2>Advertisements</h2><div class="ads">'+E.ads.map(function(a){return '<div class="ad"><b>'+a[0]+'</b>'+a[1]+'</div>'}).join('')+'</div>';
h+='<div class="fl">❦ ❦ ❦</div><h2>A Dictionary of Commerce<small>Touch a word to learn its meaning</small></h2>'+flips(E.words);
h+='<div class="fl">❦ ❦ ❦</div><h2>The Examination<small>Three questions, no cane involved</small></h2><div class="box" id="quiz"></div>';
h+='<h2 style="margin-top:22px">Subscribers\' Opinion</h2><div class="box poll">'+E.poll+'<br><br><button data-v="Yes">Yea</button> <button data-v="No">Nay</button> <button data-v="Uncertain">Uncertain</button><p id="pollout" style="font-style:italic;color:var(--mut)"></p></div>';
h+='<footer>'+E.foot+'</footer>';
document.getElementById('app').innerHTML=h;
document.querySelectorAll('.flip').forEach(function(b){b.addEventListener('click',function(){b.classList.toggle('on')})});
E.stories.forEach(function(s){
 if(s.ledger){var L=s.ledger,left=L.total;document.getElementById('omo').addEventListener('click',function(){
  left=Math.max(0,+(left-L.step).toFixed(2));
  document.getElementById('cash').style.width=(left/L.total*100)+'%';
  document.getElementById('cashtxt').textContent=L.label+': '+(L.pre===undefined?'₹':L.pre)+left.toFixed(L.dp===undefined?2:L.dp)+(L.suf===undefined?' lakh crore':L.suf);
  var st=document.getElementById('st');st.classList.remove('go');void st.offsetWidth;st.classList.add('go');
  if(left===0)this.disabled=true})}
 if(s.race){var R=s.race;document.getElementById('race').addEventListener('click',function(){
  document.getElementById('b1').style.width='100%';document.getElementById('b2').style.width=(R.b[2]/R.a[2]*100)+'%'})}
});
var qi=0,sc=0,Q=E.quiz,qz=document.getElementById('quiz');
function show(){
 if(qi>=Q.length){qz.innerHTML='<b class="t">Result</b><h3 style="margin:0">'+sc+' of '+Q.length+' correct</h3><p>'+(sc===Q.length?'Top marks. The Collector would be proud.':'Read the columns again and return, friend.')+'</p><button id="again">Sit again</button>';
  document.getElementById('again').onclick=function(){qi=0;sc=0;show()};return}
 var q=Q[qi];qz.innerHTML='<b class="t">Question '+(qi+1)+'</b>'+q[0]+'<div class="opts"></div>';
 var o=qz.querySelector('.opts');
 q[1].forEach(function(t,i){var b=document.createElement('button');b.textContent=t;
  b.onclick=function(){var ok=i===q[2];if(ok)sc++;b.className=ok?'ok':'no';o.children[q[2]].className='ok';
   Array.prototype.forEach.call(o.children,function(x){x.disabled=true});setTimeout(function(){qi++;show()},1100)};
  o.appendChild(b)});
}
show();
document.querySelectorAll('.poll button').forEach(function(b){b.addEventListener('click',function(){
 document.getElementById('pollout').textContent='Your vote of "'+b.dataset.v+'" is recorded, on your own page only.'})});
document.getElementById('theme').addEventListener('click',function(){
 var r=document.documentElement,d=r.getAttribute('data-theme');
 var dark=d?d==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 r.setAttribute('data-theme',dark?'light':'dark')});
}
fetch('edition.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():EDITION}).catch(function(){return EDITION}).then(boot);
</script>
</body>
</html>
