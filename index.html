<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Dhanda Patrika | धंधा पत्रिका</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Playfair+Display:wght@700;900&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{--paper:#E4D2A0;--ink:#1A140C;--red:#8E2A1E;--blue:#1F2D55;--card:#EBDDB5;--mut:#5a4a32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root[data-theme="dark"]{--paper:#1C170F;--ink:#E8D8AC;--red:#E27A66;--blue:#A9B8F2;--card:#261F13;--mut:#b3a380}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:10px;background-color:var(--paper);background-image:radial-gradient(circle at 12% 18%,rgba(110,70,20,.18),transparent 22%),radial-gradient(circle at 85% 40%,rgba(110,70,20,.14),transparent 25%),radial-gradient(circle at 30% 90%,rgba(110,70,20,.18),transparent 28%);color:var(--ink);font:400 18px/1.6 "IM Fell English",Georgia,"Times New Roman",serif}
main{max-width:880px;margin:0 auto;border:5px double var(--ink);padding:14px 22px 40px}
.ears{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-style:italic;border-bottom:1px solid var(--ink);padding-bottom:4px}
.mast{text-align:center;padding:14px 0 8px;border-bottom:4px double var(--ink)}
.hi{font:400 clamp(28px,7vw,46px)/1.1 "Tiro Devanagari Hindi","Noto Serif Devanagari",serif;color:var(--red);margin:0;animation:ink 2s ease-out both}
.en{font:900 clamp(22px,7.4vw,74px)/1 "Playfair Display",Georgia,serif;white-space:nowrap;letter-spacing:1px;margin:2px 0 4px;animation:ink 2s .35s ease-out both}
@keyframes ink{from{opacity:0;filter:blur(9px);transform:scale(1.04)}to{opacity:1;filter:blur(0)}}
.motto{font-style:italic;font-size:14px;color:var(--mut);margin-top:4px}
.dateline{text-align:center;font-variant:small-caps;letter-spacing:1px;border-bottom:1px solid var(--ink);padding:5px 0;font-size:15px}
h2{font:900 clamp(22px,5vw,30px)/1.1 "Playfair Display",Georgia,serif;text-transform:uppercase;letter-spacing:1px;text-align:center;margin:0}
h2 small{display:block;font:italic 400 16px "IM Fell English",Georgia,serif;text-transform:none;letter-spacing:0;color:var(--mut);margin-top:5px}
.big{font-size:clamp(28px,7vw,52px);line-height:1.05}
.deck{text-align:center;font-style:italic;margin:8px auto;max-width:620px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:3px double var(--ink);border-bottom:3px double var(--ink);margin:14px 0 6px}.nums div{text-align:center;padding:14px 6px;border-right:1px solid var(--ink)}.nums div:last-child{border-right:0}.nums b{display:block;font:900 clamp(28px,6.5vw,42px)/1 "Playfair Display",Georgia,serif;color:var(--red)}.nums span{display:block;font-style:italic;font-size:14px;color:var(--mut);margin-top:4px}
.fl{text-align:center;color:var(--red);font-size:22px;margin:22px 0 4px;letter-spacing:10px}
.cols{column-width:290px;column-gap:26px;column-rule:1px solid var(--ink);text-align:justify;hyphens:auto;margin-top:12px}
.cols p{margin:0 0 9px}
.cols p:first-child:first-letter{font:900 3.4em/.8 "Playfair Display",serif;float:left;padding:6px 7px 0 0;color:var(--red)}
.box{border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;background:var(--card);padding:10px 14px;margin:16px 4px}
.box b.t{display:block;font:900 14px "Playfair Display",serif;font-variant:small-caps;letter-spacing:1px;color:var(--red);margin-bottom:2px}
.stop{border:4px double var(--red);padding:10px 14px;margin:18px 4px;text-align:center;background:var(--card)}
.stop b{color:var(--red);font-size:20px;letter-spacing:3px;animation:bl 1.4s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
table{width:100%;border-collapse:collapse;font-size:15.5px;margin-top:10px}
td,th{border-bottom:1px dotted var(--ink);padding:6px 5px;text-align:left;vertical-align:top}
th{border-bottom:2px solid var(--ink);font:700 16px "Playfair Display",serif;font-variant:small-caps}
td.v{font:900 17px "Playfair Display",serif}
td small{color:var(--mut);font-style:italic}
button{font:700 16px "Playfair Display",Georgia,serif;color:var(--card);background:var(--red);border:2px solid var(--ink);padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px) rotate(-1deg);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.led{position:relative;border:2px solid var(--ink);height:28px;margin:12px 0 4px;background:repeating-linear-gradient(90deg,transparent 0 17px,rgba(0,0,0,.13) 17px 18px)}
.led i{display:block;height:100%;background:var(--blue);transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.stamp{position:absolute;right:8px;top:-8px;border:3px solid var(--red);color:var(--red);font:900 18px "Playfair Display",serif;padding:0 8px;background:var(--card);opacity:0;transform:rotate(-8deg)}
.stamp.go{animation:th .9s ease-out}
@keyframes th{0%{transform:rotate(-8deg) scale(2.5);opacity:0}25%,80%{transform:rotate(-8deg) scale(1);opacity:1}100%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:12px}
.flip{perspective:700px;background:none;border:0;box-shadow:none;padding:0;text-align:left;color:var(--ink);font:400 16px/1.45 "IM Fell English",serif;min-height:150px}
.flip:active{transform:none;box-shadow:none}
.flip>span{display:block;position:relative;min-height:150px;transform-style:preserve-3d;transition:transform .6s}
.flip.on>span{transform:rotateY(180deg)}
.flip em{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:3px;padding:10px;margin:4px;font-style:normal;background:var(--card);overflow:auto}
.flip em:first-child{display:grid;place-items:center;text-align:center;font:900 21px/1.15 "Playfair Display",serif;background:var(--red);color:var(--card)}
.flip em:last-child{transform:rotateY(180deg)}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{background:var(--card);color:var(--ink);text-align:left}
.opts button.ok{background:var(--blue);color:#fff}
.opts button.no{background:var(--red);color:#fff}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:12px}
.ad{border:3px double var(--ink);padding:10px;text-align:center;font-size:15px;background:var(--card)}
.ad b{display:block;font:900 19px/1.1 "Playfair Display",serif;text-transform:uppercase;margin-bottom:4px}
footer{margin-top:30px;border-top:4px double var(--ink);padding-top:8px;text-align:center;font-style:italic;font-size:13px;color:var(--mut)}
.dive{text-align:center;margin:6px 0 4px}
.dive button{position:relative;font-size:21px;letter-spacing:1px;padding:14px 30px;box-shadow:5px 5px 0 var(--ink)}
.dive button:before,.dive button:after{content:"";position:absolute;bottom:100%;left:24%;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:var(--card);opacity:0;animation:bub 2.6s infinite}
.dive button:after{left:70%;width:7px;height:7px;animation-delay:1.1s}
.dive button.up:before,.dive button.up:after{animation:none}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-38px);opacity:0}}
.dh{font-style:italic;color:var(--mut);font-size:15px;margin:10px 0 0;min-height:1.2em}
.deep{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .7s ease,opacity .7s ease,visibility 0s .7s}
.deep.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.deepin{overflow:hidden;min-height:0;padding:0 6px 6px}
.notice{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92vw,460px);z-index:20;background:var(--card);border:3px double var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px;animation:drop .6s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.notice b{font:900 14px "Playfair Display",Georgia,serif;font-variant:small-caps;letter-spacing:1px;color:var(--red)}
.notice p{margin:6px 0 10px;font-size:16px;line-height:1.45}
.subf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.subf input[type=email]{flex:1 1 220px;min-width:0;font:400 17px "IM Fell English",Georgia,serif;padding:11px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.subf input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.subf .hp{position:absolute;left:-9999px;width:1px;height:1px}
#subs{text-align:center;font-style:italic;min-height:1.3em;margin:8px 0 0}
.subp{font-size:13px;color:var(--mut);text-align:center;font-style:italic;margin:4px 0 0}
.by{margin-top:6px;font-size:13px;font-style:italic;color:var(--mut)}
@media(max-width:480px){main{padding:12px 14px 36px}body{padding:6px}}
html[lang="hi"] .notice b,html[lang="hi"] .subf input,html[lang="hi"] .by{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif}
#lang{position:fixed;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));font:700 16px "Tiro Devanagari Hindi","Playfair Display",Georgia,serif;padding:8px 14px;z-index:9;animation:nudge 1.1s 1.5s 2}
@keyframes nudge{50%{transform:scale(1.12) rotate(-3deg)}}
html[lang="hi"] body,html[lang="hi"] h2,html[lang="hi"] h3,html[lang="hi"] button,html[lang="hi"] th,html[lang="hi"] td,html[lang="hi"] .nums b,html[lang="hi"] .nums span,html[lang="hi"] .box b.t,html[lang="hi"] .ad b,html[lang="hi"] .flip em,html[lang="hi"] .stamp,html[lang="hi"] .stop b{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI",serif}
html[lang="hi"] *{font-style:normal!important}
html[lang="hi"] body{line-height:1.75}html[lang="hi"] h2{letter-spacing:0;text-transform:none}html[lang="hi"] .cols{text-align:left;hyphens:manual}
#theme{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;padding:6px 10px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="notice" class="notice" hidden role="dialog" aria-label="Notice"></div>
<button id="lang" aria-label="Read in Hindi" hidden>अ हिन्दी</button>
<button id="theme" aria-label="Toggle day or lamp-light">Day / Lamp</button>

 व्यावसायिक और भारी वाहनों के लिए रास्ते बदले।", "द हिंदू, 11 अक्टूबर, दोपहर 12:15"], ["रियाद हवाई अड्डे पर हमला", "रियाद हवाई अड्डे पर मिसाइल हमले में कम से कम 12 लोग मारे गए और 300 से ज़्यादा घायल हुए। यह सऊदी अरब में एक दशक से ज़्यादा समय का सबसे घातक हमला है। भारत ने हमले को \"पूरी तरह अस्वीकार्य\" बताते हुए निंदा की।", "हिंदुस्तान टाइम्स, 11 अक्टूबर, सुबह 09:35 · 3 आउटलेट पर चर्चा में"], ["भारत का संयुक्त राष्ट्र को जवाब", "भारत ने दिल्ली में 2,000 प्रदर्शनकारियों की हिरासत पर संयुक्त राष्ट्र मानवाधिकार निकाय की चिंता को ख़ारिज किया और इन टिप्पणियों को आंतरिक मामलों में अनुचित दख़ल बताया।", "हिंदुस्तान टाइम्स, 11 अक्टूबर, सुबह 11:59"], ["मणिपुर: हिंसा की एक रात", "लगभग 12 घंटे में पहाड़ी ज़िलों में फैली हिंसा के दौरान कुकी और नागा समुदायों के आम नागरिकों समेत नौ लोग मारे गए। प्रदर्शन के दौरान एक कुकी महिला की मौत के बाद झड़पें बढ़ीं, और दोनों समूहों के बीच जवाबी हमलों में कई घर और दुकानें जला दी गईं। मणिपुर के मुख्यमंत्री ने सुरक्षा और शांति प्रयासों पर प्रधानमंत्री मोदी से बात की।", "टाइम्स ऑफ़ इंडिया, 10 अक्टूबर, रात 11:40 · 3 आउटलेट पर चर्चा में"], ["एनटीए पर सवाल", "कांग्रेस नेता जयराम रमेश ने एनटीए पर संसदीय स्थायी समिति की रिपोर्ट का हवाला देते हुए नौ पेपर लीक और छात्रों के लिए इस्तेमाल न हुए ₹590 करोड़ के अधिशेष का आरोप लगाया। उन्होंने कहा कि उन्हें उम्मीद है कि सरकार रिपोर्ट को गंभीरता से लेगी।", "द हिंदू, 11 अक्टूबर, सुबह 11:14"], ["धरती ने हल्के से कंधे उचकाए", "उत्तरकाशी में 4.2 तीव्रता का भूकंप आया, जो चार दिन में उत्तराखंड का दूसरा है। अधिकारियों के मुताबिक़ अब तक किसी नुक़सान की ख़बर नहीं।", "द हिंदू, 11 अक्टूबर, सुबह 07:12"], ["चुनाव आयोग में नई कुर्सी", "राजस्थान कैडर के 2010 बैच के आईएएस अधिकारी प्रकाश राजपुरोहित फेरबदल में संजय कुमार की जगह उप चुनाव आयुक्त बने।", "हिंदुस्तान टाइम्स, 10 अक्टूबर, रात 08:51"], ["दिल्ली: हिरासत और रिहाई", "यूट्यूबर ध्रुव राठी हिरासत से रिहा हुए और उन्होंने \"अपहरण\" का आरोप लगाया। पुलिस सूत्रों के मुताबिक़ सुरक्षा कड़ी किए जाने के बीच कई जगहों पर 7,000 से ज़्यादा प्रदर्शनकारी हिरासत में लिए गए।", "द हिंदू, 11 अक्टूबर, दोपहर 12:14"], ["निफ़्टी की साप्ताहिक कुंडली", "बिज़नेसलाइन के आकलन के मुताबिक़ निफ़्टी और सेंसेक्स अहम सपोर्ट के ऊपर टिके हैं और अच्छी रिकवरी की संभावना बनी हुई है। यह अनुमान है, वादा नहीं।", "द हिंदू बिज़नेसलाइन, 11 अक्टूबर, सुबह 09:01"], ["आने वाला हफ़्ता, आँकड़ों में", "मिंट के पूर्वावलोकन में महँगाई का दबाव, आईएमएफ़ के विकास अनुमान और कच्चे तेल का उत्पादन उन आँकड़ों और घटनाओं में गिनाए गए हैं जो हफ़्ते को दिशा दे सकते हैं।", "मिंट इकोनॉमी, 11 अक्टूबर, सुबह 11:00"]]}}, "dispatches": {"t": "The Wire: Everything Else Today", "sub": "One line each, a smile where it is kind, none where it is not", "items": [["Chennai's Metro Stretches Its Legs", "PM Modi and Tamil Nadu Chief Minister Vijay inaugurated the Chennai Metro Rail Phase 2 stretch. The Greater Chennai Traffic Police announced diversions for commercial and heavy vehicles at several locations in the city on Sunday, 11 October, for the Prime Minister's one-day visit.", "The Hindu, 11 Oct, 12:15 PM"], ["Riyadh Airport Attack", "At least 12 people were killed and over 300 injured in a missile attack on Riyadh airport, the deadliest in Saudi Arabia in more than a decade. India condemned the attack as \"completely unacceptable\".", "Hindustan Times, 11 Oct, 09:35 AM · In the news at 3 outlets"], ["India Answers the UN", "India rejected the UN human rights body's concern over the detention of 2,000 protesters in Delhi, calling the remarks unwarranted interference in internal affairs.", "Hindustan Times, 11 Oct, 11:59 AM"], ["Manipur: A Night of Violence", "Nine people, including civilians from the Kuki and Naga communities, were killed as violence engulfed hill districts over about 12 hours. Clashes escalated after the death of a Kuki woman during protests, and multiple houses and shops were set on fire in retaliatory attacks between the groups. Manipur's chief minister met PM Modi to discuss security and peace efforts.", "Times of India, 10 Oct, 11:40 PM · In the news at 3 outlets"], ["The NTA Under Questioning", "Congress leader Jairam Ramesh cited a Parliamentary Standing Committee report on the NTA, alleging nine paper leaks and a ₹590 crore surplus left unused for students. He said he hopes the government takes the report seriously.", "The Hindu, 11 Oct, 11:14 AM"], ["The Earth Gave a Small Shrug", "A 4.2-magnitude earthquake hit Uttarkashi, the second in Uttarakhand in four days. Officials report no damage so far.", "The Hindu, 11 Oct, 07:12 AM"], ["A New Chair at the Election Commission", "Prakash Rajpurohit, a 2010-batch IAS officer of the Rajasthan cadre, replaces Sanjay Kumar as deputy election commissioner in a reshuffle.", "Hindustan Times, 10 Oct, 08:51 PM"], ["Delhi: Detentions and Releases", "YouTuber Dhruv Rathee was released from detention and alleged \"kidnapping\". Police sources say more than 7,000 protesters were detained at multiple locations amid a security clampdown.", "The Hindu, 11 Oct, 12:14 PM"], ["Nifty's Weekly Crystal Ball", "A BusinessLine outlook says the Nifty and Sensex are holding above crucial support and the chances of a good recovery are alive. It is a prediction, not a promise.", "The Hindu BusinessLine, 11 Oct, 09:01 AM"], ["The Week Ahead, in Numbers", "Mint's preview lists inflation pressures, the IMF's growth forecasts and crude output among the data and events that could shape the week.", "Mint Economy, 11 Oct, 11:00 AM"]]}};

hi:{btn:'A  English',nt:'संचालक की सूचना',nb:'यह अख़बार पहले महीने मुफ़्त है, जैसे पहली कप चाय हमारी तरफ़ से। उसके बाद एक छोटी मासिक सदस्यता लग सकती है। आज आपसे कुछ नहीं माँगा जा रहा, और कोई भी बदलाव होने से काफ़ी पहले आपको बताया जाएगा।',nk:'समझ गया, संचालक जी',st:'पत्रिका सीधे आपके इनबॉक्स में',ss:'चाय ठंडी होने से पहले, दिन की ख़बरें आपके पास',sb:'तार भेजिए',sp:'सिर्फ़ रोज़ की ख़बर के लिए। कोई स्पैम नहीं, किसी से साझा नहीं। जब चाहें छोड़ सकते हैं।',sph:'you@example.com',sok:'तार मिल गया! अपना इनबॉक्स देखते रहिए।',sbad:'यह पता ग़लत लगता है। कृपया जाँचें।',ssoon:'सदस्यता जल्द ही खुलेगी। थोड़ी देर में लौटिए!',serr:'तार टूट गया। कृपया फिर कोशिश करें।',by:function(){return 'मुद्रक एवं प्रकाशक: '+CFG.creatorHi+', द धंधा प्रेस'},dive:'गहरे उतरें',up:'सतह पर लौटें',hint:function(n){return n+' और ख़बरें सतह के नीचे'},motto:'बाज़ार की ख़बरें, दोस्त की तरह समझाई हुई',matter:'विषय',reading:'भाव',remarks:'टिप्पणी',plain:'आसान शब्दों में',care:'आपके लिए इसका मतलब',stop:'अभी-अभी',ads:'विज्ञापन',dict:'व्यापार शब्दकोश',dictSub:'किसी शब्द को छूकर उसका अर्थ जानिए',exam:'परीक्षा',examSub:'तीन सवाल, छड़ी की ज़रूरत नहीं',poll:'पाठकों की राय',yea:'हाँ',nay:'नहीं',unc:'पक्का नहीं',q:function(n){return 'सवाल '+n},res:function(a,n){return n+' में से '+a+' सही'},top:'पूरे अंक! कलेक्टर साहब ख़ुश होंगे।',low:'कॉलम फिर से पढ़िए और लौटिए, मित्र।',again:'फिर से बैठिए',voted:function(v){return 'आपका वोट «'+v+'» दर्ज हुआ, सिर्फ़ आपके पेज पर।'}}};
function hiEd(D){var h=D.hi;if(!h)return D;var E=Object.assign({},D,h);
 E.rates=D.rates.map(function(r){if(/OroPocket/.test(r[0])){var g=r[0].indexOf('Gold')===0;
  return [g?'सोना (ओरोपॉकेट)':'चाँदी (ओरोपॉकेट)',r[1].replace('Buy','खरीद').replace('Sell','बिक्री').replace('per gram','प्रति ग्राम'),
   r[2].replace(/^DELAYED\. Last update (.*?)\. OroPocket.*$/,'विलंबित। आख़िरी अपडेट: $1। ओरोपॉकेट की दरें, रुपये प्रति ग्राम; MCX या स्पॉट भाव नहीं।').replace(/^As of (.*?)\. OroPocket.*$/,'$1 तक। ओरोपॉकेट की दरें, रुपये प्रति ग्राम; MCX या स्पॉट भाव नहीं।')]}
  return (h.rates||{})[r[0]]||r});
 E.stories=D.stories.map(function(s,i){var t=(h.stories||[])[i];if(!t)return s;var o=Object.assign({},s,t);
  if(s.ledger)o.ledger=Object.assign({},s.ledger,t.ledger||{});
  if(s.race&&t.race)o.race={a:[t.race.a[0],t.race.a[1],s.race.a[2]],b:[t.race.b[0],t.race.b[1],s.race.b[2]],btn:t.race.btn};
  return o});return E}
var NSEEN=false;try{NSEEN=localStorage.getItem('dp-notice')==='1'}catch(e){}
function paintNotice(){var n=document.getElementById('notice'),U=UI[LANG];n.innerHTML='<b>'+U.nt+'</b><p>'+U.nb+'</p><button id="nok">'+U.nk+'</button>';document.getElementById('nok').onclick=function(){n.hidden=true;try{localStorage.setItem('dp-notice','1')}catch(e){}}}
function openNotice(){if(NSEEN)return;setTimeout(function(){paintNotice();document.getElementById('notice').hidden=false},5000)}
function boot(D){EN=D;document.getElementById('lang').hidden=!D.hi;if(!D.hi)LANG='en';else try{if(localStorage.getItem('dp-lang')==='hi')LANG='hi'}catch(e){}
 document.documentElement.lang=LANG;document.getElementById('lang').textContent=UI[LANG].btn;render();openNotice()}
function render(){var E=LANG==='hi'?hiEd(EN):EN,U=UI[LANG],h='';
function box(t,x){return '<div class="box"><b class="t">'+t+'</b>'+x+'</div>'}
function flips(a){return '<div class="grid">'+a.map(function(c){return '<button class="flip" aria-label="Turn card"><span><em>'+c[0]+'</em><em>'+c[1]+'</em></span></button>'}).join('')+'</div>'}
h+='<header class="mast"><p class="hi">धंधा पत्रिका</p><h1 class="en">The Dhanda Patrika</h1><div class="motto">'+U.motto+'</div></header><div class="dateline">'+E.date+'</div>';
h+='<div class="nums">'+E.nums.map(function(n){return '<div><b>'+n[0]+'</b><span>'+n[1]+'</span></div>'}).join('')+'</div>';
h+='<h2 style="margin-top:20px">'+E.ratesTitle+'</h2><table><tr><th>'+U.matter+'</th><th>'+U.reading+'</th><th>'+U.remarks+'</th></tr>'+E.rates.map(function(r){return '<tr><td>'+r[0]+'</td><td class="v">'+r[1]+'</td><td><small>'+r[2]+'</small></td></tr>'}).join('')+'</table>';
E.stories.forEach(function(s,i){
 h+='<div class="fl">❦ ❦ ❦</div><h2>'+s.t+'<small>'+s.sub+'</small></h2>';
 if(s.paras.length)h+='<div class="cols">'+s.paras.map(function(p){return '<p>'+p+'</p>'}).join('')+'</div>';
 if(s.plain)h+=box(U.plain,s.plain);
 if(s.cards)h+='<h3 style="margin:14px 0 0;font-style:italic">'+s.cardsT+'</h3>'+flips(s.cards);
 if(s.tiles)h+='<div class="grid">'+s.tiles.map(function(t){return box(t[0],t[1])}).join('')+'</div>';
 if(s.ledger)h+=box(s.ledger.title,'<button id="omo">'+s.ledger.btn+'</button><div class="led"><i id="cash" style="width:100%"></i><span class="stamp" id="st">'+(s.ledger.stamp||'SOLD')+'</span></div><span id="cashtxt" style="font-style:italic;color:var(--mut)">'+s.ledger.label+': '+(s.ledger.pre===undefined?'₹':s.ledger.pre)+s.ledger.total.toFixed(s.ledger.dp===undefined?2:s.ledger.dp)+(s.ledger.suf===undefined?' lakh crore':s.ledger.suf)+'</span>');
 if(s.race)h+='<button id="race">'+s.race.btn+'</button><p style="margin:12px 0 0">'+s.race.a[0]+', '+s.race.a[1]+'</p><div class="led"><i id="b1" style="width:0;background:var(--red)"></i></div><p style="margin:8px 0 0">'+s.race.b[0]+', '+s.race.b[1]+'</p><div class="led"><i id="b2" style="width:0"></i></div>';
 if(s.care)h+=box(U.care,s.care);
});
if(E.dispatches){var nd=E.dispatches.items.length;h+='<div class="fl">❦ ❦ ❦</div><div class="dive"><button id="dive" class="'+(DEEP?'up':'')+'" aria-expanded="'+DEEP+'" aria-controls="deep"><span class="dl">'+(DEEP?U.up:U.dive)+'</span></button><p class="dh" id="dh">'+(DEEP?'':U.hint(nd))+'</p></div><div id="deep" class="deep'+(DEEP?' open':'')+'"><div class="deepin"><h2>'+E.dispatches.t+'<small>'+E.dispatches.sub+'</small></h2><div class="grid">'+E.dispatches.items.map(function(d){return box(d[0],d[1]+'<br><small style="color:var(--mut);font-style:italic">'+d[2]+'</small>')}).join('')+'</div></div></div>'}
h+='<div class="stop"><b>'+U.stop+'</b><br>'+E.stop+'</div>';
h+='<div class="fl">❦ ❦ ❦</div><h2>'+U.ads+'</h2><div class="ads">'+E.ads.map(function(a){return '<div class="ad"><b>'+a[0]+'</b>'+a[1]+'</div>'}).join('')+'</div>';
h+='<div class="fl">❦ ❦ ❦</div><h2>'+U.dict+'<small>'+U.dictSub+'</small></h2>'+flips(E.words);
h+='<div class="fl">❦ ❦ ❦</div><h2>'+U.exam+'<small>'+U.examSub+'</small></h2><div class="box" id="quiz"></div>';
h+='<h2 style="margin-top:22px">'+U.poll+'</h2><div class="box poll">'+E.poll+'<br><br><button data-v="Yes">'+U.yea+'</button> <button data-v="No">'+U.nay+'</button> <button data-v="Uncertain">'+U.unc+'</button><p id="pollout" style="font-style:italic;color:var(--mut)"></p></div>';
h+='<div class="fl">❦ ❦ ❦</div><h2>'+U.st+'<small>'+U.ss+'</small></h2><div class="box"><form id="subf" class="subf" novalidate><input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><input type="email" name="email" placeholder="'+U.sph+'" aria-label="Email" autocomplete="email" required><button type="submit">'+U.sb+'</button></form><p id="subs" role="status"></p><p class="subp">'+U.sp+'</p></div>';
h+='<footer>'+E.foot+'<div class="by">'+U.by()+'</div></footer>';
document.getElementById('app').innerHTML=h;
document.querySelectorAll('.flip').forEach(function(b){b.addEventListener('click',function(){b.classList.toggle('on')})});
var sf=document.getElementById('subf');if(sf)sf.addEventListener('submit',function(ev){ev.preventDefault();var em=sf.email.value.trim(),so=document.getElementById('subs');
 if(sf.website.value){so.textContent=U.sok;return}
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){so.textContent=U.sbad;return}
 if(!CFG.form||!CFG.field){so.textContent=U.ssoon;return}
 var fd=new FormData();fd.append(CFG.field,em);
 fetch(CFG.form,{method:'POST',mode:'no-cors',body:fd}).then(function(){so.textContent=U.sok;sf.reset()}).catch(function(){so.textContent=U.serr})});
var dv=document.getElementById('dive');if(dv)dv.addEventListener('click',function(){DEEP=!DEEP;document.getElementById('deep').classList.toggle('open',DEEP);dv.classList.toggle('up',DEEP);dv.setAttribute('aria-expanded',DEEP);
 dv.querySelector('.dl').textContent=DEEP?U.up:U.dive;document.getElementById('dh').textContent=DEEP?'':U.hint(E.dispatches.items.length);if(!DEEP)dv.scrollIntoView({block:'center',behavior:'smooth'})});
E.stories.forEach(function(s){
 if(s.ledger){var L=s.ledger,left=L.total;document.getElementById('omo').addEventListener('click',function(){
  left=Math.max(0,+(left-L.step).toFixed(2));
  document.getElementById('cash').style.width=(left/L.total*100)+'%';
  document.getElementById('cashtxt').textContent=L.label+': '+(L.pre===undefined?'₹':L.pre)+left.toFixed(L.dp===undefined?2:L.dp)+(L.suf===undefined?' lakh crore':L.suf);
  var st=document.getElementById('st');st.classList.remove('go');void st.offsetWidth;st.classList.add('go');
  if(left===0)this.disabled=true})}
 if(s.race){var R=s.race;document.getElementById('race').addEventListener('click',function(){
  document.getElementById('b1').style.width='100%';document.getElementById('b2').style.width=(R.b[2]/R.a[2]*100)+'%'})}
});
var qi=0,sc=0,Q=E.quiz,qz=document.getElementById('quiz');
function show(){
 if(qi>=Q.length){qz.innerHTML='<b class="t">'+U.exam+'</b><h3 style="margin:0">'+U.res(sc,Q.length)+'</h3><p>'+(sc===Q.length?U.top:U.low)+'</p><button id="again">'+U.again+'</button>';
  document.getElementById('again').onclick=function(){qi=0;sc=0;show()};return}
 var q=Q[qi];qz.innerHTML='<b class="t">'+U.q(qi+1)+'</b>'+q[0]+'<div class="opts"></div>';
 var o=qz.querySelector('.opts');
 q[1].forEach(function(t,i){var b=document.createElement('button');b.textContent=t;
  b.onclick=function(){var ok=i===q[2];if(ok)sc++;b.className=ok?'ok':'no';o.children[q[2]].className='ok';
   Array.prototype.forEach.call(o.children,function(x){x.disabled=true});setTimeout(function(){qi++;show()},1100)};
  o.appendChild(b)});
}
show();
document.querySelectorAll('.poll button').forEach(function(b){b.addEventListener('click',function(){
 document.getElementById('pollout').textContent=U.voted(b.textContent)})});
}
document.getElementById('theme').addEventListener('click',function(){var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')});
document.getElementById('lang').addEventListener('click',function(){var y=window.scrollY;LANG=LANG==='hi'?'en':'hi';try{localStorage.setItem('dp-lang',LANG)}catch(e){}
 document.documentElement.lang=LANG;this.textContent=UI[LANG].btn;render();window.scrollTo(0,y);if(!document.getElementById('notice').hidden)paintNotice()});
fetch('edition.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():EDITION}).catch(function(){return EDITION}).then(boot);
</script>
