name: Update live numbers
on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-numbers
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch gold and silver
        run: python scripts/update_numbers.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "dhanda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add edition.json data/status.json
          git diff --cached --quiet || (git commit -m "Update live numbers" && git push)
